name: CI
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Test and quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: clippy,rustfmt,llvm-tools-preview

      - name: Cache cargo registry, git deps, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ci-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-cargo-

      - name: Install Linux GUI dependencies
        run: ./.github/scripts/install-linux-gui-deps.sh

      - name: Install Linux image tool dependencies
        run: ./.github/scripts/install-linux-image-deps.sh

      - name: Ensure cargo-outdated
        run: ./.github/scripts/ensure-cargo-outdated.sh

      - name: Run local quality gate
        run: ./.githooks/run-style-checks.sh

      - name: Run unit tests (with report)
        id: unit-tests
        run: |
          set -o pipefail
          test_log="${RUNNER_TEMP:-/tmp}/mini-film-unit-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          echo "UNIT_TEST_LOG=$test_log" >> "$GITHUB_ENV"
          cargo test --all-targets --no-default-features --no-fail-fast -- --nocapture --test-threads=1 | tee "$test_log"
        continue-on-error: false

      - name: Install cargo-llvm-cov
        run: |
          set -euo pipefail
          if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
            cargo install --locked cargo-llvm-cov
          fi

      - name: Run coverage
        run: |
          set -euo pipefail
          chmod +x ./scripts/coverage.sh
          ./scripts/coverage.sh

      - name: Publish unit test report
        if: always()
        run: |
          set -euo pipefail

          test_log="${UNIT_TEST_LOG:-${RUNNER_TEMP:-/tmp}/mini-film-unit-tests-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}.log}"
          if [[ ! -f "$test_log" ]]; then
            test_log="/tmp/unit-tests.log"
          fi

          result_lines=$(grep -E "^test result:" "$test_log" 2>/dev/null || true)

          echo "## Unit test report"

          {
            echo
            echo "### Result summary"

            if [[ -n "$result_lines" ]]; then
              echo "| Run | Status | Passed | Failed | Ignored | Measured | Filtered | Duration |"
              echo "| --- | --- | ---: | ---: | ---: | ---: | ---: | :-- |"

              overall_failed=0
              total_runs=0

              while IFS= read -r line; do
                if [[ -n "$line" ]]; then
                  total_runs=$((total_runs + 1))

                  status_token="${line#test result: }"
                  status_token="${status_token%% *}"
                  status="${status_token%.}"
                  body="${line#test result: ${status_token} }"

                  cleaned=$(printf "%s" "$body" | sed -E \
                    's/ passed; / /g; s/ failed; / /g; s/ ignored; / /g; s/ measured; / /g; s/ filtered out; / /g; s/ finished in / /g')

                  read -r passed failed ignored measured filtered duration <<< "$cleaned"
                  [[ -z "${passed:-}" ]] && passed="-"
                  [[ -z "${failed:-}" ]] && failed="-"
                  [[ -z "${ignored:-}" ]] && ignored="-"
                  [[ -z "${measured:-}" ]] && measured="-"
                  [[ -z "${filtered:-}" ]] && filtered="-"
                  [[ -z "${duration:-}" ]] && duration="-"

                  if [[ "$status" != "ok" && "$status" != "FAILED" ]]; then
                    status="unknown"
                  fi

                  if [[ "$status" == "FAILED" ]]; then
                    overall_failed=1
                    status_cell="<span style=\"color:#c0392b;font-weight:700\">FAILED</span>"
                  elif [[ "$status" == "ok" ]]; then
                    status_cell="<span style=\"color:#16a085;font-weight:700\">ok</span>"
                  else
                    status_cell="<span style=\"color:#7f8c8d\">${status}</span>"
                  fi

                  echo "| ${total_runs} | ${status_cell} | ${passed} | ${failed} | ${ignored} | ${measured} | ${filtered} | ${duration} |"
                fi
              done <<< "$result_lines"

              if [[ "$overall_failed" -eq 0 ]]; then
                echo
                echo "- **Overall status:** <span style=\"color:#16a085;font-weight:700\">PASS</span>"
              else
                echo
                echo "- **Overall status:** <span style=\"color:#c0392b;font-weight:700\">FAILED</span>"
              fi
            else
              echo "- No test summary was found in the output"
              echo "- Status: unknown"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f target/coverage/coverage-summary.json ]]; then
            {
              echo
              echo "### Coverage summary"
              python3 -c 'import json; data = json.load(open("target/coverage/coverage-summary.json", "r", encoding="utf-8")); totals = data["data"][0]["totals"]; line = totals["lines"]["percent"]; functions = totals["functions"]["percent"]; regions = totals["regions"]["percent"]; print("- Lines: {:.2f}%".format(line)); print("- Functions: {:.2f}%".format(functions)); print("- Regions: {:.2f}%".format(regions))'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Coverage summary" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage summary artifact was not generated in this run." >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo
            if [[ -f "$test_log" ]] && grep -q "FAILED" "$test_log"; then
              echo "### Failed test cases"
              echo "<details><summary>Click to expand failed tests</summary>"
              echo
              echo '```'
              grep -n "FAILED" "$test_log" | head -n 120
              echo '```'
              echo '</details>'
            fi
            echo
            echo "### Tail of test log"
            echo "<details><summary>Click to expand tail</summary>"
            echo
            echo '```'
            if [[ -f "$test_log" ]]; then
              tail -n 120 "$test_log"
            else
              echo "Unit test log was not generated."
            fi
            echo '```'
            echo '</details>'
            echo
            echo "Full test log path on the runner: ${test_log}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release smoke binaries
        run: |
          set -euo pipefail
          cargo build --release --no-default-features
          cargo build --release

  tag-on-version-bump:
    name: Tag release
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test-and-lint.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Check cargo versions
        run: ./.githooks/check-cargo-versions.sh

      - name: Create and push version tag if version changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current_sha="${GITHUB_SHA:-$(git rev-parse HEAD)}"

          if ! git cat-file -e "${current_sha}^:Cargo.toml" 2>/dev/null; then
            echo "No parent commit available; skipping version tag auto-generation."
            exit 0
          fi

          if ! git diff --name-only "${current_sha}^" "$current_sha" -- Cargo.toml | grep -qx 'Cargo.toml'; then
            echo "Cargo.toml version did not change; skipping tag creation."
            exit 0
          fi

          old_version=$(awk -F'=' '/^version[[:space:]]*=/ { gsub(/[[:space:]]/, "", $2); gsub(/"/, "", $2); print $2; exit }' < <(git show "${current_sha}^:Cargo.toml"))
          new_version=$(awk -F'=' '/^version[[:space:]]*=/ { gsub(/[[:space:]]/, "", $2); gsub(/"/, "", $2); print $2; exit }' Cargo.toml)

          if [[ -z "$old_version" || -z "$new_version" ]]; then
            echo "Failed to read version field from Cargo.toml."
            exit 1
          fi

          if [[ "$old_version" == "$new_version" ]]; then
            echo "Version unchanged (${new_version}); skipping tag creation."
            exit 0
          fi

          tag="v${new_version}"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          if git -c "http.https://github.com/.extraheader=${auth_header}" ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists in remote; skipping."
            exit 0
          fi

          if git tag --list "$tag" >/dev/null && git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "Tag ${tag} already exists locally; skipping."
            exit 0
          fi

          git tag "$tag" "$current_sha"
          if ! git -c "http.https://github.com/.extraheader=${auth_header}" push origin "$tag"; then
            echo "Push of ${tag} failed, checking if tag appeared in remote concurrently..."
            if git -c "http.https://github.com/.extraheader=${auth_header}" ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists in remote after push race; treating as success."
              exit 0
            fi
            exit 1
          fi
