name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            extension: ""
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            extension: ""
            use_cross: true
          - target: aarch64-apple-darwin
            extension: ""
            use_cross: true
          - target: x86_64-pc-windows-gnu
            extension: ".exe"
            use_cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: |
          cargo install --locked cross

      - name: Build release binary
        run: |
          set -euo pipefail
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          binary="target/${{ matrix.target }}/release/mini-film${{ matrix.extension }}"
          artifact="artifacts/mini-film-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.extension }}"
          cp "$binary" "$artifact"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-film-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish release
    runs-on: self-hosted
    needs: build-binaries
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: mini-film-*
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          current_tag="${GITHUB_REF_NAME}"
          prev_tag=""
          prev_short=""

          prev_tag=$(git tag --sort=-version:refname --list 'v*' | awk -v current="$current_tag" '$1 != current {print $1; exit}')

          if [ -n "$prev_tag" ]; then
            prev_short=$(git rev-parse --short "$prev_tag")
          fi

          echo "# mini-film ${current_tag}" > release-notes.md
          if [ -n "$prev_tag" ]; then
            echo "" >> release-notes.md
            echo "Previous release: ${prev_tag} (${prev_short})" >> release-notes.md
          else
            echo "" >> release-notes.md
            echo "Previous release: none" >> release-notes.md
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/*
