name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to build and publish"
        required: false
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  resolve-release:
    name: Resolve release context
    runs-on: self-hosted
    if: |
      github.event_name != 'workflow_run' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      source_ref: ${{ steps.release.outputs.source_ref }}
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE"
          cd /
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch --force --tags origin "$CHECKOUT_REF"
          git checkout --force FETCH_HEAD
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check cargo versions
        shell: bash
        run: ./.githooks/check-cargo-versions.sh

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          event="${{ github.event_name }}"
          should_release="false"
          source_ref="${GITHUB_SHA}"
          release_tag=""

          if [ "$event" = "workflow_dispatch" ]; then
            release_tag="${{ inputs.release_tag }}"
            if [ -z "$release_tag" ]; then
              release_tag="${GITHUB_REF_NAME}"
            fi
            should_release="true"
          elif [ "$event" = "push" ]; then
            release_tag="${GITHUB_REF_NAME}"
            should_release="true"
          else
            source_ref="${{ github.event.workflow_run.head_sha }}"
            if git cat-file -e "${source_ref}^:Cargo.toml" 2>/dev/null; then
              old_version=$(awk -F'=' '/^version[[:space:]]*=/ { gsub(/[[:space:]]/, "", $2); gsub(/"/, "", $2); print $2; exit }' < <(
                git show "${source_ref}^:Cargo.toml"
              ))
              new_version=$(awk -F'=' '/^version[[:space:]]*=/ { gsub(/[[:space:]]/, "", $2); gsub(/"/, "", $2); print $2; exit }' < <(
                git show "${source_ref}:Cargo.toml"
              ))
              if [ -n "$old_version" ] && [ -n "$new_version" ] && [ "$old_version" != "$new_version" ]; then
                release_tag="v${new_version}"
                should_release="true"
              fi
            fi
          fi

          if [ -z "$release_tag" ] || [ "$should_release" != "true" ]; then
            should_release="false"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: resolve-release
    runs-on: ${{ matrix.runs_on }}
    if: needs.resolve-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            extension: ""
            runs_on: self-hosted
            use_cross: false
            cargo_features: "github-update"
          - target: aarch64-unknown-linux-gnu
            extension: ""
            runs_on: ubuntu-latest
            use_cross: true
            cargo_features: ""
          - target: aarch64-apple-darwin
            extension: ""
            runs_on: macos-latest
            use_cross: false
            cargo_features: "github-update"
          - target: x86_64-pc-windows-msvc
            runs_on: windows-latest
            extension: ".exe"
            use_cross: false
            cargo_features: "github-update"

    steps:
      - name: Checkout (GitHub-hosted)
        if: ${{ matrix.runs_on != 'self-hosted' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.source_ref }}

      - name: Checkout (self-hosted)
        if: ${{ matrix.runs_on == 'self-hosted' }}
        shell: bash
        env:
          CHECKOUT_REF: ${{ needs.resolve-release.outputs.source_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE"
          cd /
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch --force --tags origin "$CHECKOUT_REF"
          git checkout --force FETCH_HEAD
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check cargo versions
        shell: bash
        run: ./.githooks/check-cargo-versions.sh

      - name: Cache cargo registry, git deps, and target
        if: ${{ matrix.runs_on != 'self-hosted' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ matrix.target }}
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=${{ needs.resolve-release.outputs.release_tag }}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        if: ${{ matrix.runs_on != 'self-hosted' }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Install Rust (self-hosted)
        if: ${{ matrix.runs_on == 'self-hosted' }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly --target "${{ matrix.target }}"
          rustup default nightly

      - name: Install cross
        if: matrix.use_cross
        run: |
          cargo install --locked cross

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo_features="${{ matrix.cargo_features }}"
          feature_args=()
          if [ -n "$cargo_features" ]; then
            feature_args=(--features "$cargo_features")
          fi

          if [ "${{ matrix.use_cross }}" = "true" ]; then
            if ! env PKG_CONFIG_ALLOW_CROSS=1 cross build --release --target "${{ matrix.target }}" "${feature_args[@]}"; then
              echo "::warning::cross build failed; retrying native cargo build for ${{ matrix.target }}."
              PKG_CONFIG_ALLOW_CROSS=1 cargo build --release --target "${{ matrix.target }}" "${feature_args[@]}"
            fi
          else
            PKG_CONFIG_ALLOW_CROSS=1 cargo build --release --target "${{ matrix.target }}" "${feature_args[@]}"
          fi

      - name: Publish to crates.io
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail

          crate_name="mini-film"
          crate_version="$(awk -F'=' '/^version[[:space:]]*=/ { gsub(/[[:space:]]/, "", $2); gsub(/"/, "", $2); print $2; exit }' Cargo.toml)"
          if [ -z "$crate_version" ]; then
            echo "Could not resolve crate version from Cargo.toml" >&2
            exit 1
          fi

          skip_publish="false"

          if command -v curl >/dev/null 2>&1; then
            set +e
            crate_json="$(curl -fsSL --max-time 30 "https://crates.io/api/v1/crates/${crate_name}" 2>/dev/null)"
            curl_status=$?
            set -e
            if [ "$curl_status" -eq 0 ]; then
              if printf '%s\n' "$crate_json" | grep -F "\"num\":\"${crate_version}\"" >/dev/null; then
                echo "${crate_name} ${crate_version} already exists on crates.io; skipping publish."
                skip_publish="true"
              fi
            else
              echo "Could not query crates.io API (curl exit ${curl_status}); publish will rely on cargo publish error handling."
            fi
          else
            echo "curl not available; publish will rely on cargo publish error handling."
          fi

          token_file="${CARGO_REGISTRY_TOKEN_FILE:-/home/alfanick/.etcfiles/.cargo_registry_token}"
          if [ ! -f "$token_file" ]; then
            echo "Cargo registry token file not found: $token_file" >&2
            exit 1
          fi

          token="$(tr -d '[:space:]' < "$token_file")"
          if [ -z "$token" ]; then
            echo "Cargo registry token file is empty: $token_file" >&2
            exit 1
          fi

          if [ "$skip_publish" = "true" ]; then
            echo "Skipping publish: ${crate_name} ${crate_version} already exists in crates index."
          else
            publish_output="$(mktemp)"
            trap 'rm -f "$publish_output"' EXIT
            set +e
            cargo publish --locked --no-verify --token "$token" >"$publish_output" 2>&1
            publish_status=$?
            set -e

            if [ "$publish_status" -ne 0 ]; then
              if grep -Eq "already (uploaded|exists)|crate.*already|you cannot upload a new version of this crate" "$publish_output"; then
                echo "crate version already published; skipping crates.io publish."
              elif grep -Eqi "(429|too many requests|rate.?limit|too many requests|service unavailable)" "$publish_output"; then
                echo "::warning::crates.io publish was rate-limited or temporarily unavailable; skipping crates.io publish for this run."
                echo "To retry, run cargo publish with the same version after rate limits clear."
              else
                cat "$publish_output" >&2
                exit "$publish_status"
              fi
            else
              echo "published mini-film to crates.io"
              cat "$publish_output"
            fi
          fi

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          binary="target/${{ matrix.target }}/release/mini-film${{ matrix.extension }}"
          artifact="artifacts/mini-film-${{ steps.release-tag.outputs.tag }}-${{ matrix.target }}${{ matrix.extension }}"
          cp "$binary" "$artifact"

      - name: Upload artifact
        if: ${{ matrix.runs_on != 'self-hosted' }}
        uses: actions/upload-artifact@v4
        with:
          name: mini-film-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

      - name: Store artifact on self-hosted runner
        if: ${{ matrix.runs_on == 'self-hosted' }}
        shell: bash
        run: |
          set -euo pipefail
          store="$HOME/.cache/mini-film/release-artifacts/${GITHUB_RUN_ID}"
          mkdir -p "$store"
          cp artifacts/* "$store/"
          echo "Stored self-hosted artifact in $store"

  publish-release:
    name: Publish release
    runs-on: self-hosted
    needs:
      - resolve-release
      - build-binaries
    if: needs.resolve-release.outputs.should_release == 'true'
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ needs.resolve-release.outputs.source_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE"
          cd /
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch --force --tags origin "$CHECKOUT_REF"
          git checkout --force FETCH_HEAD
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check cargo versions
        shell: bash
        run: ./.githooks/check-cargo-versions.sh

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=${{ needs.resolve-release.outputs.release_tag }}" >> "$GITHUB_OUTPUT"

      - name: Collect release artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          python3 .github/scripts/download-run-artifacts.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --pattern 'mini-film-*' \
            --output artifacts

          self_hosted_store="$HOME/.cache/mini-film/release-artifacts/${GITHUB_RUN_ID}"
          if [[ -d "$self_hosted_store" ]]; then
            cp "$self_hosted_store"/* artifacts/
          fi

          shopt -s nullglob
          files=(artifacts/*)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No release artifacts were collected." >&2
            exit 1
          fi
          printf 'Collected release artifacts:\n'
          printf '  %s\n' "${files[@]}"

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          current_tag="${{ needs.resolve-release.outputs.release_tag }}"
          prev_tag=""
          prev_short=""

          prev_tag=$(git tag --sort=-version:refname --list 'v*' | awk -v current="$current_tag" '$1 != current {print $1; exit}')

          if [ -n "$prev_tag" ]; then
            prev_short=$(git rev-parse --short "$prev_tag")
          fi

          echo "# mini-film ${current_tag}" > release-notes.md
          if [ -n "$prev_tag" ]; then
            echo "" >> release-notes.md
            echo "Previous release: ${prev_tag} (${prev_short})" >> release-notes.md
          else
            echo "" >> release-notes.md
            echo "Previous release: none" >> release-notes.md
          fi

      - name: Publish GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/publish-github-release.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "${{ needs.resolve-release.outputs.release_tag }}" \
            --target "${{ needs.resolve-release.outputs.source_ref }}" \
            --notes release-notes.md \
            --assets artifacts
