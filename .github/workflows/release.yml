# Build each CLI and desktop artifact natively so npm installs tools for the
# actual host platform before Cargo embeds the checked browser bundle.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to build and publish"
        required: false
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  resolve-release:
    name: Resolve release context
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_run' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      source_ref: ${{ steps.release.outputs.source_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Check cargo versions
        shell: bash
        run: ./.githooks/check-cargo-versions.sh

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          event="${{ github.event_name }}"
          should_release="false"
          source_ref="${GITHUB_SHA}"
          release_tag=""

          if [ "$event" = "workflow_dispatch" ]; then
            release_tag="${{ inputs.release_tag }}"
            if [ -z "$release_tag" ]; then
              release_tag="${GITHUB_REF_NAME}"
            fi
            should_release="true"
          elif [ "$event" = "push" ]; then
            release_tag="${GITHUB_REF_NAME}"
            should_release="true"
          else
            source_ref="${{ github.event.workflow_run.head_sha }}"
            if git cat-file -e "${source_ref}^:Cargo.toml" 2>/dev/null; then
              old_version=$(awk -F'=' '/^version[[:space:]]*=/ { gsub(/[[:space:]]/, "", $2); gsub(/"/, "", $2); print $2; exit }' < <(
                git show "${source_ref}^:Cargo.toml"
              ))
              new_version=$(awk -F'=' '/^version[[:space:]]*=/ { gsub(/[[:space:]]/, "", $2); gsub(/"/, "", $2); print $2; exit }' < <(
                git show "${source_ref}:Cargo.toml"
              ))
              if [ -n "$old_version" ] && [ -n "$new_version" ] && [ "$old_version" != "$new_version" ]; then
                release_tag="v${new_version}"
                should_release="true"
              fi
            fi
          fi

          if [ -z "$release_tag" ] || [ "$should_release" != "true" ]; then
            should_release="false"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build ${{ matrix.target }}${{ matrix.artifact_suffix }}
    needs: resolve-release
    runs-on: ${{ matrix.runs_on }}
    if: needs.resolve-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            extension: ""
            artifact_suffix: ""
            runs_on: ubuntu-latest
            cargo_features: "github-update"
            default_features: false
          - target: aarch64-unknown-linux-gnu
            extension: ""
            artifact_suffix: ""
            runs_on: ubuntu-24.04-arm
            cargo_features: ""
            default_features: false
          - target: aarch64-apple-darwin
            extension: ""
            artifact_suffix: ""
            runs_on: macos-latest
            cargo_features: "github-update"
            default_features: false
          - target: x86_64-pc-windows-msvc
            runs_on: windows-latest
            extension: ".exe"
            artifact_suffix: ""
            cargo_features: "github-update"
            default_features: false
          - target: x86_64-unknown-linux-gnu
            extension: ""
            artifact_suffix: "-gui"
            runs_on: ubuntu-latest
            cargo_features: "github-update"
            default_features: true
          - target: aarch64-unknown-linux-gnu
            extension: ""
            artifact_suffix: "-gui"
            runs_on: ubuntu-24.04-arm
            cargo_features: "github-update"
            default_features: true
          - target: aarch64-apple-darwin
            extension: ""
            artifact_suffix: "-gui"
            runs_on: macos-latest
            cargo_features: "github-update"
            default_features: true
          - target: x86_64-pc-windows-msvc
            runs_on: windows-latest
            extension: ".exe"
            artifact_suffix: "-gui"
            cargo_features: "github-update"
            default_features: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.source_ref }}

      - name: Check cargo versions
        shell: bash
        run: ./.githooks/check-cargo-versions.sh

      - name: Cache cargo registry, git deps, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ matrix.target }}
          key: ${{ runner.os }}-${{ matrix.target }}${{ matrix.artifact_suffix }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}${{ matrix.artifact_suffix }}-cargo-

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=${{ needs.resolve-release.outputs.release_tag }}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux GUI dependencies
        if: ${{ matrix.artifact_suffix == '-gui' && contains(matrix.target, 'linux') }}
        shell: bash
        run: ./.github/scripts/install-linux-gui-deps.sh

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo_features="${{ matrix.cargo_features }}"
          build_args=(--release --target "${{ matrix.target }}")
          if [ "${{ matrix.default_features }}" != "true" ]; then
            build_args+=(--no-default-features)
          fi
          if [ -n "$cargo_features" ]; then
            build_args+=(--features "$cargo_features")
          fi

          cargo build --locked "${build_args[@]}"

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          binary="target/${{ matrix.target }}/release/mini-film${{ matrix.extension }}"
          artifact="artifacts/mini-film-${{ steps.release-tag.outputs.tag }}-${{ matrix.target }}${{ matrix.artifact_suffix }}${{ matrix.extension }}"
          cp "$binary" "$artifact"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-film-${{ matrix.target }}${{ matrix.artifact_suffix }}
          path: artifacts/*
          if-no-files-found: error

  publish-crate:
    name: Publish crates.io package
    runs-on: ubuntu-latest
    needs: resolve-release
    if: needs.resolve-release.outputs.should_release == 'true'
    environment: Default
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.source_ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Check cargo versions
        shell: bash
        run: ./.githooks/check-cargo-versions.sh

      - name: Publish to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          crate_name="mini-film"
          crate_version="$(awk -F'=' '/^version[[:space:]]*=/ { gsub(/[[:space:]]/, "", $2); gsub(/"/, "", $2); print $2; exit }' Cargo.toml)"
          if [ -z "$crate_version" ]; then
            echo "Could not resolve crate version from Cargo.toml" >&2
            exit 1
          fi

          skip_publish="false"

          if command -v curl >/dev/null 2>&1; then
            set +e
            crate_json="$(curl -fsSL --max-time 30 "https://crates.io/api/v1/crates/${crate_name}" 2>/dev/null)"
            curl_status=$?
            set -e
            if [ "$curl_status" -eq 0 ]; then
              if printf '%s\n' "$crate_json" | grep -F "\"num\":\"${crate_version}\"" >/dev/null; then
                echo "${crate_name} ${crate_version} already exists on crates.io; skipping publish."
                skip_publish="true"
              fi
            else
              echo "Could not query crates.io API (curl exit ${curl_status}); publish will rely on cargo publish error handling."
            fi
          else
            echo "curl not available; publish will rely on cargo publish error handling."
          fi

          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN secret is not set; skipping crates.io publish."
            exit 0
          fi

          if [ "$skip_publish" = "true" ]; then
            echo "Skipping publish: ${crate_name} ${crate_version} already exists in crates index."
          else
            publish_output="$(mktemp)"
            trap 'rm -f "$publish_output"' EXIT
            set +e
            cargo publish --locked --no-verify --token "$CARGO_REGISTRY_TOKEN" >"$publish_output" 2>&1
            publish_status=$?
            set -e

            if [ "$publish_status" -ne 0 ]; then
              if grep -Eq "already (uploaded|exists)|crate.*already|you cannot upload a new version of this crate" "$publish_output"; then
                echo "crate version already published; skipping crates.io publish."
              elif grep -Eqi "(429|too many requests|rate.?limit|too many requests|service unavailable)" "$publish_output"; then
                echo "::warning::crates.io publish was rate-limited or temporarily unavailable; skipping crates.io publish for this run."
                echo "To retry, run cargo publish with the same version after rate limits clear."
              else
                cat "$publish_output" >&2
                exit "$publish_status"
              fi
            else
              echo "published mini-film to crates.io"
              cat "$publish_output"
            fi
          fi

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - resolve-release
      - build-binaries
      - publish-crate
    if: needs.resolve-release.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.source_ref }}

      - name: Check cargo versions
        shell: bash
        run: ./.githooks/check-cargo-versions.sh

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=${{ needs.resolve-release.outputs.release_tag }}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: mini-film-*
          merge-multiple: true

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No release artifacts were collected." >&2
            exit 1
          fi
          printf 'Collected release artifacts:\n'
          printf '  %s\n' "${files[@]}"

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          current_tag="${{ needs.resolve-release.outputs.release_tag }}"
          prev_tag=""
          prev_short=""

          prev_tag=$(git tag --sort=-version:refname --list 'v*' | awk -v current="$current_tag" '$1 != current {print $1; exit}')

          if [ -n "$prev_tag" ]; then
            prev_short=$(git rev-parse --short "$prev_tag")
          fi

          echo "# mini-film ${current_tag}" > release-notes.md
          if [ -n "$prev_tag" ]; then
            echo "" >> release-notes.md
            echo "Previous release: ${prev_tag} (${prev_short})" >> release-notes.md
          else
            echo "" >> release-notes.md
            echo "Previous release: none" >> release-notes.md
          fi

      - name: Publish GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/publish-github-release.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "${{ needs.resolve-release.outputs.release_tag }}" \
            --target "${{ needs.resolve-release.outputs.source_ref }}" \
            --notes release-notes.md \
            --assets artifacts
