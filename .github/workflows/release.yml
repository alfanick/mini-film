name: Release
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to build and publish"
        required: false
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  resolve-release:
    name: Resolve release context
    runs-on: self-hosted
    if: |
      github.event_name != 'workflow_run' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      source_ref: ${{ steps.release.outputs.source_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref_name }}

      - name: Check cargo versions
        shell: bash
        run: ./.githooks/check-cargo-versions.sh

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          event="${{ github.event_name }}"
          should_release="false"
          source_ref="${GITHUB_SHA}"
          release_tag=""

          if [ "$event" = "workflow_dispatch" ]; then
            release_tag="${{ inputs.release_tag }}"
            if [ -z "$release_tag" ]; then
              release_tag="${GITHUB_REF_NAME}"
            fi
            should_release="true"
          elif [ "$event" = "push" ]; then
            release_tag="${GITHUB_REF_NAME}"
            should_release="true"
          else
            source_ref="${{ github.event.workflow_run.head_sha }}"
            if git cat-file -e "${source_ref}^:Cargo.toml" 2>/dev/null; then
              old_version=$(awk -F'=' '/^version[[:space:]]*=/ { gsub(/[[:space:]]/, "", $2); gsub(/"/, "", $2); print $2; exit }' < <(
                git show "${source_ref}^:Cargo.toml"
              ))
              new_version=$(awk -F'=' '/^version[[:space:]]*=/ { gsub(/[[:space:]]/, "", $2); gsub(/"/, "", $2); print $2; exit }' < <(
                git show "${source_ref}:Cargo.toml"
              ))
              if [ -n "$old_version" ] && [ -n "$new_version" ] && [ "$old_version" != "$new_version" ]; then
                release_tag="v${new_version}"
                should_release="true"
              fi
            fi
          fi

          if [ -z "$release_tag" ] || [ "$should_release" != "true" ]; then
            should_release="false"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: resolve-release
    runs-on: ${{ matrix.runs_on }}
    if: needs.resolve-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            extension: ""
            runs_on: self-hosted
            use_cross: false
            cargo_features: "github-update"
          - target: aarch64-unknown-linux-gnu
            extension: ""
            runs_on: ubuntu-latest
            use_cross: true
            cargo_features: ""
          - target: aarch64-apple-darwin
            extension: ""
            runs_on: macos-latest
            use_cross: false
            cargo_features: "github-update"
          - target: x86_64-pc-windows-msvc
            runs_on: windows-latest
            extension: ".exe"
            use_cross: false
            cargo_features: "github-update"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.source_ref }}

      - name: Check cargo versions
        shell: bash
        run: ./.githooks/check-cargo-versions.sh

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=${{ needs.resolve-release.outputs.release_tag }}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: |
          cargo install --locked cross

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo_features="${{ matrix.cargo_features }}"
          feature_args=()
          if [ -n "$cargo_features" ]; then
            feature_args=(--features "$cargo_features")
          fi

          if [ "${{ matrix.use_cross }}" = "true" ]; then
            if ! cross build --release --locked --target "${{ matrix.target }}" "${feature_args[@]}"; then
              echo "::warning::cross build failed; retrying native cargo build for ${{ matrix.target }}."
              cargo build --release --locked --target "${{ matrix.target }}" "${feature_args[@]}"
            fi
          else
            cargo build --release --locked --target "${{ matrix.target }}" "${feature_args[@]}"
          fi

      - name: Publish to crates.io
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail

          token_file="${CARGO_REGISTRY_TOKEN_FILE:-/home/alfanick/.etcfiles/.cargo_registry_token}"
          if [ ! -f "$token_file" ]; then
            echo "Cargo registry token file not found: $token_file" >&2
            exit 1
          fi

          token="$(tr -d '[:space:]' < "$token_file")"
          if [ -z "$token" ]; then
            echo "Cargo registry token file is empty: $token_file" >&2
            exit 1
          fi

          publish_output="$(mktemp)"
          set +e
          cargo publish --locked --no-verify --token "$token" >"$publish_output" 2>&1
          publish_status=$?
          set -e

          if [ "$publish_status" -ne 0 ]; then
            if grep -q "already uploaded" "$publish_output"; then
              echo "crate version already published; skipping crates.io publish."
            else
              cat "$publish_output" >&2
              rm -f "$publish_output"
              exit "$publish_status"
            fi
          else
            echo "published mini-film to crates.io"
            cat "$publish_output"
          fi

          rm -f "$publish_output"

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          binary="target/${{ matrix.target }}/release/mini-film${{ matrix.extension }}"
          artifact="artifacts/mini-film-${{ steps.release-tag.outputs.tag }}-${{ matrix.target }}${{ matrix.extension }}"
          cp "$binary" "$artifact"

      - name: Regenerate public sampler HTML on x86_64 Linux build
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail

          binary="target/${{ matrix.target }}/release/mini-film${{ matrix.extension }}"

          if [ ! -x "$binary" ]; then
            echo "Built binary not found: $binary"
            exit 1
          fi

          mkdir -p /home/alfanick/Web/mini-film

          "$binary" sampler \
            /home/alfanick/Pictures/mini-film-sample.dng \
            --output /home/alfanick/Web/mini-film/sampler.html \
            --profiles-root /home/alfanick/Pictures/RNI \
            --jpg-quality 70 \
            --progressive \
            --columns 4 \
            --thumbnail-long-edge 2048

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-film-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish release
    runs-on: self-hosted
    needs:
      - resolve-release
      - build-binaries
    if: needs.resolve-release.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.source_ref }}

      - name: Check cargo versions
        shell: bash
        run: ./.githooks/check-cargo-versions.sh

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=${{ needs.resolve-release.outputs.release_tag }}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: mini-film-*
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          current_tag="${{ needs.resolve-release.outputs.release_tag }}"
          prev_tag=""
          prev_short=""

          prev_tag=$(git tag --sort=-version:refname --list 'v*' | awk -v current="$current_tag" '$1 != current {print $1; exit}')

          if [ -n "$prev_tag" ]; then
            prev_short=$(git rev-parse --short "$prev_tag")
          fi

          echo "# mini-film ${current_tag}" > release-notes.md
          if [ -n "$prev_tag" ]; then
            echo "" >> release-notes.md
            echo "Previous release: ${prev_tag} (${prev_short})" >> release-notes.md
          else
            echo "" >> release-notes.md
            echo "Previous release: none" >> release-notes.md
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release.outputs.release_tag }}
          name: ${{ needs.resolve-release.outputs.release_tag }}
          body_path: release-notes.md
          files: |
            artifacts/*
