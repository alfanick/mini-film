name: Release
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to build and publish"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            extension: ""
            runs_on: self-hosted
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            extension: ""
            runs_on: self-hosted
            use_cross: true
          - target: aarch64-apple-darwin
            extension: ""
            runs_on: macos-latest
            use_cross: false
          - target: x86_64-pc-windows-msvc
            runs_on: windows-latest
            extension: ".exe"
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: |
          cargo install --locked cross

      - name: Build release binary
        run: |
          set -euo pipefail
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          binary="target/${{ matrix.target }}/release/mini-film${{ matrix.extension }}"
          artifact="artifacts/mini-film-${{ steps.release-tag.outputs.tag }}-${{ matrix.target }}${{ matrix.extension }}"
          cp "$binary" "$artifact"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-film-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish release
    runs-on: self-hosted
    needs: build-binaries
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: mini-film-*
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            current_tag="${{ inputs.release_tag }}"
          else
            current_tag="${GITHUB_REF_NAME}"
          fi
          prev_tag=""
          prev_short=""

          prev_tag=$(git tag --sort=-version:refname --list 'v*' | awk -v current="$current_tag" '$1 != current {print $1; exit}')

          if [ -n "$prev_tag" ]; then
            prev_short=$(git rev-parse --short "$prev_tag")
          fi

          echo "# mini-film ${current_tag}" > release-notes.md
          if [ -n "$prev_tag" ]; then
            echo "" >> release-notes.md
            echo "Previous release: ${prev_tag} (${prev_short})" >> release-notes.md
          else
            echo "" >> release-notes.md
            echo "Previous release: none" >> release-notes.md
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: ${{ steps.release-tag.outputs.tag }}
          body_path: release-notes.md
          files: |
            artifacts/*
