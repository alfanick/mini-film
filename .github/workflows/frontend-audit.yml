# Check changing advisory data on a schedule without making deterministic Cargo builds depend on audit services.
name: Frontend dependency audit
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Audit locked build and runtime dependencies
        run: npm audit --audit-level=high
