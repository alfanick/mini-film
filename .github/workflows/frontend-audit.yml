# Check changing advisory and release metadata without coupling deterministic Cargo builds to online services.
name: Frontend dependency freshness and audit
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Audit locked build and runtime dependencies
        run: npm audit --audit-level=high
      - name: Install locked version-check tooling
        run: npm ci --ignore-scripts --include=dev --include=optional --no-audit --no-fund
      - name: Reject newer supported frontend releases
        run: npm run check:frontend-versions
