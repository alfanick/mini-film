<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mini-film app</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <header>
          <div>
            <p class="eyebrow">mini-film</p>
            <h1>Start Review Daemon</h1>
          </div>
          <span id="version" class="version">loading</span>
        </header>

        <form id="wizard" autocomplete="off">
          <div class="grid two">
            <div class="field">
              <label for="input">Input Inbox</label>
              <div class="path-row">
                <input id="input" name="input" required placeholder="/path/to/inbox" />
                <button type="button" class="secondary" data-pick-directory="input">Choose</button>
              </div>
            </div>
            <div class="field">
              <label for="output">Output Folder</label>
              <div class="path-row">
                <input id="output" name="output" required placeholder="/path/to/output" />
                <button type="button" class="secondary" data-pick-directory="output">Choose</button>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="profilesRoot">Profiles Root</label>
            <div class="path-row">
              <input id="profilesRoot" name="profilesRoot" placeholder="/path/to/profile-library" />
              <button type="button" class="secondary" data-pick-directory="profilesRoot">Choose</button>
            </div>
          </div>

          <div class="field">
            <div class="field-title">
              <label for="profiles">Profiles</label>
              <button type="button" class="secondary" id="chooseProfiles">Choose Profiles</button>
            </div>
            <textarea
              id="profiles"
              name="profiles"
              required
              rows="4"
              placeholder="One profile selector per line, for example:&#10;Classic Film&#10;Soft Fade grainy"
            ></textarea>
          </div>

          <div class="grid three">
            <label>
              <span>Review Port</span>
              <input id="reviewPort" name="reviewPort" inputmode="numeric" type="number" min="1" max="65535" />
            </label>
            <label>
              <span>Nikon WTU IP</span>
              <input id="nikonWtu" name="nikonWtu" placeholder="optional" />
            </label>
            <label>
              <span>Jobs</span>
              <input id="jobs" name="jobs" inputmode="numeric" type="number" min="1" />
            </label>
          </div>

          <div class="checks inline">
            <label><input id="allowOthers" name="allowOthers" type="checkbox" /> Allow others on the network</label>
          </div>

          <div class="grid three">
            <label>
              <span>Long Edge</span>
              <input id="longEdge" name="longEdge" inputmode="numeric" type="number" min="1" />
            </label>
          </div>

          <div class="grid three">
            <label>
              <span>JPEG Quality</span>
              <input id="jpgQuality" name="jpgQuality" inputmode="numeric" type="number" min="1" max="100" />
            </label>
            <label>
              <span>Gallery</span>
              <select id="gallery" name="gallery">
                <option value="">None</option>
                <option value="modern">Modern</option>
                <option value="soft">Soft</option>
                <option value="compact">Compact</option>
                <option value="hero">Hero</option>
                <option value="phone">Phone</option>
              </select>
            </label>
            <label>
              <span>Publish Folder</span>
              <input id="publishAlbum" name="publishAlbum" />
            </label>
          </div>

          <details>
            <summary>Engine and processing options</summary>
            <div class="grid two compact">
              <label>
                <span>RawTherapee</span>
                <input id="rawtherapee" name="rawtherapee" />
              </label>
              <label>
                <span>Convert</span>
                <input id="convert" name="convert" />
              </label>
              <label>
                <span>Hald Cache</span>
                <input id="haldDir" name="haldDir" />
              </label>
              <label>
                <span>Color Denoise ISO</span>
                <input id="colorNoiseIsoThreshold" name="colorNoiseIsoThreshold" type="number" min="0" />
              </label>
              <label>
                <span>Grain Preset</span>
                <select id="grainPreset" name="grainPreset">
                  <option value="">Profile default</option>
                  <option value="light">Light</option>
                  <option value="medium">Medium</option>
                  <option value="heavy">Heavy</option>
                </select>
              </label>
            </div>
            <div class="checks">
              <label><input id="progressiveJpeg" name="progressiveJpeg" type="checkbox" /> Progressive JPEG</label>
              <label><input id="noGrain" name="noGrain" type="checkbox" /> Disable profile grain</label>
              <label><input id="lensCorrections" name="lensCorrections" type="checkbox" /> Lens corrections</label>
            </div>
            <div class="field compact-field">
              <div class="field-title">
                <label><input id="codex" name="codex" type="checkbox" /> Codex analysis</label>
              </div>
              <div class="checks inline">
                <label><input id="codexTags" name="codexTags" type="checkbox" /> Tags</label>
                <label><input id="codexNote" name="codexNote" type="checkbox" /> Note</label>
                <label><input id="codexRating" name="codexRating" type="checkbox" /> Rating</label>
              </div>
            </div>
            <div class="grid three compact">
              <label>
                <span>Codex</span>
                <input id="codexBinary" name="codexBinary" />
              </label>
              <label>
                <span>Model</span>
                <input id="codexModel" name="codexModel" />
              </label>
              <label>
                <span>Timeout</span>
                <input id="codexTimeout" name="codexTimeout" type="number" min="1" />
              </label>
            </div>
          </details>

          <footer>
            <p id="status" class="status">Ready.</p>
            <button id="start" type="submit">Start Review</button>
          </footer>
        </form>
      </section>
    </main>
    <div id="profilePicker" class="modal" hidden>
      <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="profilePickerTitle">
        <header>
          <div>
            <p class="eyebrow" id="profilePickerRoot">profiles</p>
            <h2 id="profilePickerTitle">Choose Profiles</h2>
          </div>
          <button type="button" class="secondary" id="closeProfilePicker">Close</button>
        </header>
        <div class="modal-tools">
          <input id="profileFilter" placeholder="Filter profiles" />
          <span id="profilePickerCount" class="status">0 selected</span>
        </div>
        <div id="profileTree" class="profile-tree"></div>
        <footer>
          <button type="button" class="secondary" id="clearProfiles">Clear</button>
          <button type="button" id="applyProfiles">Use Selected Profiles</button>
        </footer>
      </section>
    </div>
  </body>
</html>
