[package]
name = "mini-film"
version = "13.3.5"
description = "Review and publish RAW, JPEG, and HEIC photos with optional Lightroom-style film emulation profiles for RAW workflows."
repository = "https://github.com/alfanick/mini-film"
homepage = "https://github.com/alfanick/mini-film"
readme = "README.md"
edition = "2024"
license = "MIT"

[features]
default = ["desktop-app"]
desktop-app = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]
github-update = ["dep:self_update"]

[profile.release]
opt-level = 3
debug = 0
incremental = true
lto = "thin"
codegen-units = 16
panic = "abort"
overflow-checks = false
strip = "symbols"

[dependencies]
chrono = "0.4.42"
exif = { package = "kamadak-exif", version = "0.6.1" }
filetime = "0.2.29"
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
flate2 = "1.1.9"
handlebars = "6.4.2"
image = "0.25.10"
indicatif = "0.18.4"
noise = "0.9.0"
png = "0.18.1"
quick-xml = "0.40.1"
rayon = "1.12.0"
sanitize-filename = "0.7.0-beta"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
sha1 = "0.11.0"
self_update = { version = "0.44.0", default-features = false, features = ["reqwest", "default-tls"], optional = true }
tar = "0.4.44"
tempfile = "3.27.0"
walkdir = "2.5.0"
include_dir = "0.7.4"
notify = "8.2.0"
sysinfo = "0.39.5"
axum = { version = "0.8.9", features = ["http2"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time"] }
async-stream = "0.3.6"
tower-http = { version = "0.7.0", features = ["fs"] }
tower = "0.5.3"
tauri = { version = "2.11.3", optional = true }
tauri-plugin-dialog = { version = "2.7.1", optional = true }
arc-swap = "1"

[build-dependencies]
tauri-build = { version = "2.6.3", optional = true }
