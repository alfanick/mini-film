[package]
name = "mini-film"
version = "3.5.0"
description = "Apply Lightroom-style film emulation profiles to RAW files with RawTherapee and HALD workflows."
repository = "https://github.com/alfanick/mini-film"
homepage = "https://github.com/alfanick/mini-film"
readme = "README.md"
edition = "2024"
license = "MIT"

[features]
github-update = ["self_update"]

[profile.release]
opt-level = 3
debug = 0
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
strip = "symbols"

[dependencies]
chrono = "0.4.42"
exif = { package = "kamadak-exif", version = "0.6.1" }
filetime = "0.2.29"
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
flate2 = "1.1.9"
handlebars = "6.4.1"
image = "0.25.10"
indicatif = "0.18.4"
noise = "0.9.0"
png = "0.18.1"
quick-xml = "0.40.1"
rayon = "1.12.0"
sanitize-filename = "0.7.0-beta"
serde_json = "1.0.150"
sha1 = "0.11.0"
self_update = { version = "0.44.0", optional = true }
tempfile = "3.27.0"
walkdir = "2.5.0"
include_dir = "0.7.4"
notify = "8.2.0"
sysinfo = "0.39.3"
