[package]
name = "mini-film"
version = "22.9.3"
description = "Review and publish RAW, JPEG, and HEIC photos with optional Lightroom-style film emulation profiles."
repository = "https://github.com/alfanick/mini-film"
homepage = "https://github.com/alfanick/mini-film"
readme = "README.md"
edition = "2024"
license = "MIT"

[features]
default = ["desktop-app"]
desktop-app = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]
github-update = ["dep:self_update"]

[profile.release]
opt-level = 3
debug = 0
incremental = true
lto = "thin"
codegen-units = 16
panic = "abort"
overflow-checks = false
strip = "symbols"

[dependencies]
chrono = "0.4.42"
exif = { package = "kamadak-exif", version = "0.6.1" }
filetime = "0.2.29"
anyhow = "1.0.103"
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.9"
handlebars = "6.4.4"
image = "0.25.10"
indicatif = "0.18.6"
noise = "0.9.0"
png = "0.18.1"
pulp = "0.22.3"
quick-xml = "0.41.0"
rayon = "1.12.0"
sea-orm = { version = "=2.0.2", default-features = false, features = ["macros", "runtime-tokio", "sqlx-sqlite"] }
sea-orm-migration = { version = "=2.0.2", default-features = false, features = ["runtime-tokio", "sqlx-sqlite"] }
sanitize-filename = "0.7.0-beta"
serde_json = "1.0.151"
serde = { version = "1.0.228", features = ["derive"] }
sha1 = "0.11.0"
self_update = { version = "0.44.0", default-features = false, features = ["reqwest", "default-tls"], optional = true }
tar = "0.4.44"
tempfile = "3.27.0"
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false }
include_dir = "0.7.4"
notify = "8.2.0"
sysinfo = "0.39.6"
axum = { version = "0.8.9", features = ["http2"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time"] }
async-stream = "0.3.6"
tower-http = { version = "0.7.0", features = ["fs"] }
tower = "0.5.3"
tauri = { version = "2.11.5", optional = true }
tauri-plugin-dialog = { version = "2.7.2", optional = true }
arc-swap = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[build-dependencies]
tauri-build = { version = "2.6.3", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "diffusion"
harness = false
